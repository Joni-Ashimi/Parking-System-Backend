name: Automated AI PR Review & Summary

on:
  pull_request:
    branches: [ back-develop, main ]
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI PR Reviewer
        # FIXED: Changed to the correct community action repository path
        uses: google-gemini/gemini-pr-reviewer@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          model: 'gemini-2.5-flash'
          prompt: |
            You are an expert full-stack senior software engineer. Review the following Pull Request code changes.
            Provide your response in two sections:
            1. **Summary**: A bulleted summary of what changes were introduced.
            2. **Code Review**: Point out any potential bugs, safety risks, missing database transactions, or architecture improvements. Keep suggestions constructive, clean, and direct.